name: Backend CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('guthealth/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      
      - name: Create firebase service account key
        env:
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: |
          mkdir -p guthealth/secrets
          printf '%s' "$FIREBASE_CREDENTIALS_JSON" > guthealth/secrets/serviceAccountKey.json

      - name: 'Create env file'
        run: |
          touch .env
          echo DB_URL=${{ secrets.DB_URL }} >> guthealth/.env
          echo DB_USERNAME=${{ secrets.DB_USERNAME }} >> guthealth/.env
          echo DB_PASSWORD=${{ secrets.DB_PASSWORD }} >> guthealth/.env
          echo FIREBASE_CREDENTIALS=./secrets/serviceAccountKey.json >> guthealth/.env

      - name: Run tests (only guthealth)
        working-directory: guthealth
        run: mvn -B test

      - name: Build application (only guthealth)
        working-directory: guthealth
        run: mvn -B clean install -DskipTests

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: guthealth-backend
          path: guthealth/target/*.jar
