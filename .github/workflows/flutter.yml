# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ main, dev ]
    paths:
      - "guthealth_app/**"
  pull_request:
    branches: [ main, dev ]
    paths:
      - "guthealth_app/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: guthealth_app

    steps:
      - uses: actions/checkout@v4

      # Set up Flutter (includes the Dart SDK).
      # See: https://github.com/subosito/flutter-action
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          # flutter-version: "3.24.0" 

      - name: 'Create env file'
        run: |
          touch .env
          echo SIGNUP_URL=${{ secrets.SIGNUP }} >> guthealth_app/.env
          echo SURVEY_URL=${{ secrets.SURVEY }} >> guthealth_app/.env
          echo MOOD_URL=${{ secrets.MOOD }} >> guthealth_app/.env
          echo RECIPE_URL=${{ secrets.RECIPE }} >> guthealth_app/.env
          echo LOGIN_URL=${{ secrets.LOGIN }} >> guthealth_app/.env

      - name: Install dependencies
        run: flutter pub get

      # Uncomment this step to verify the use of 'flutter format' on each commit.
      # - name: Verify formatting
      #   run: flutter format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed. Note that Flutter projects will
      # want to change this to 'flutter test'.
      - name: Run tests
        run: flutter test
