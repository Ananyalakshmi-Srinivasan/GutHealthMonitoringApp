name: CD

on:
  push:
    branches: [ main, 33-bug-aws-backend-doesnt-run ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guthealth
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
#      - name: Create firebase service account key
#        env:
#          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS }}
#        run: |
#          mkdir -p secrets
#          printf '%s' "$FIREBASE_CREDENTIALS_JSON" > secrets/serviceAccountKey.json

      - name: Create env file
        run: |
          touch .env
          echo DB_URL=${{ secrets.DB_URL }} >> .env
          echo DB_USERNAME=${{ secrets.DB_USERNAME }} >> .env
          echo DB_PASSWORD=${{ secrets.DB_PASSWORD }} >> .env
          echo FERROCALM_EMAIL=${{ secrets.FERROCALM_EMAIL }} >> .env
          echo FERROCALM_PASSWORD=${{ secrets.FERROCALM_PASSWORD }} >> .env
#          echo FIREBASE_CREDENTIALS=./secrets/serviceAccountKey.json >> .env

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: List Dirs
        run: ls -la target/
    
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v4

        # Set of instructions  that configures aws access
      - name: Configure Amazon Web Service Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region:  ${{ secrets.AWS_REGION }}


        # Workflow that uses credentials to login to ecr!
      - name: Login to Amazon Elastic Container Registry
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

       # Cleanup workflow doesn't work need to manually remove old images.
#      - name: Cleanup Docker images (optional)
#        run: |
#          docker rmi ${{ steps.login-ecr.outputs.registry }}/${{secrets.AWS_ECR}}:latest || true

        # Set of instructions to push an image to ecr.

      - name: Build and Push Docker Image to Elastic Container Registry
        uses: docker/build-push-action@v7  # using official docker build and push workflow.
        with:
          context: ./guthealth # context is the ./guthealth folder because> this is where springboot backend lies --> compiled target lives here.
          file: ./guthealth/Dockerfile # Dockerfile instructs how to create a docker image
          push: true
          provenance: false # set provenance to false to ensure we ignore metadata images and only pushes one image for each platform and an image index which is a tag/id of the bundle of both images
          tags: ${{ steps.login-ecr.outputs.registry }}/${{secrets.AWS_ECR}}:latest # uses predetermined steps to login to private registry and access repo and tags as latest!
          platforms: linux/amd64, linux/arm64/v8 # adds one image for arm, one for amd


